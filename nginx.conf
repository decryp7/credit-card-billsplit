http {

  include mime.types;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  server {
    listen 80;
    server_name localhost;
    root /proxy;
    limit_req zone=mylimit burst=70 nodelay;

    # Files whose names change with every build (trunk adds a content hash) can be cached forever.
    location ~* "-[0-9a-f]{16}(_bg)?\.(js|wasm|ico)$" {
            root   /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

    # Everything else (index.html, pdfium.js, pdfium.wasm, sw.js, ...) keeps the same name across
    # builds, so browsers must revalidate it; otherwise a cached old pdfium.wasm breaks the new pdfium.js.
    location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
  }
}

events {}